<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tense Traveller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a sticky XP bar on top, one centred column, and a three-zone timeline (before then / then / up to now) as the colour code for every tense. */
  --bg:#eef1ff; --surface:#ffffff; --ink:#14213d; --muted:#56627f; --line:#d3daf5;
  --accent:#5b3df5; --accent-ink:#ffffff; --gold:#ffc83d;
  --good:#0f8f68; --good-bg:#dcf6ec; --bad:#d6343a; --bad-bg:#ffe4e5;
  --pperf:#7c4dff; --psimple:#0b86d6; --prperf:#e86f00;
  --display:'Bowlby One','Arial Black',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1530; --surface:#19224a; --ink:#eef1ff; --muted:#a6b1d8; --line:#2c3870;
    --accent:#9a87ff; --accent-ink:#0e1530; --gold:#ffcf4d;
    --good:#43dba7; --good-bg:#12392f; --bad:#ff8085; --bad-bg:#46202a;
    --pperf:#ab90ff; --psimple:#4db8ff; --prperf:#ffa340;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1530; --surface:#19224a; --ink:#eef1ff; --muted:#a6b1d8; --line:#2c3870;
  --accent:#9a87ff; --accent-ink:#0e1530; --gold:#ffcf4d;
  --good:#43dba7; --good-bg:#12392f; --bad:#ff8085; --bad-bg:#46202a;
  --pperf:#ab90ff; --psimple:#4db8ff; --prperf:#ffa340;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 17px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:2px solid var(--line)}
.topin{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font:400 20px/1 var(--display);color:var(--accent);background:none;border:0;padding:6px 0;letter-spacing:.3px}
.lv{min-width:150px;flex:0 1 240px}
.lvl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:700}
.lvl b{color:var(--ink)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pperf),var(--psimple),var(--prperf));border-radius:99px;transition:width .5s}
main{max-width:860px;margin:auto;padding:20px 16px 56px}
.link{background:none;border:0;color:var(--accent);font-weight:800;padding:6px 0}
.h1{font:400 clamp(30px,6vw,46px)/1.05 var(--display);margin:6px 0 10px}
.lead{color:var(--muted);margin:0 0 20px;max-width:60ch}
.namerow{display:flex;align-items:center;gap:10px;margin:0 0 22px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.namerow input{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;width:180px;font-weight:700}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.zone{background:var(--surface);border-radius:16px;padding:12px 14px;border-top:8px solid var(--c);display:flex;flex-direction:column;gap:2px;min-width:0}
.zone small{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--c)}
.zone b{font-size:18px;line-height:1.15}
.zone code{font:700 13px var(--body);color:var(--muted)}
.zone em{font-style:normal;font-weight:700;margin-top:4px}
.zone.pp{--c:var(--pperf)}.zone.ps{--c:var(--psimple)}.zone.pr{--c:var(--prperf)}
.axis{position:relative;height:30px;margin:0 0 26px}
.axis:before{content:"";position:absolute;left:0;right:46px;top:13px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--pperf),var(--psimple),var(--prperf))}
.axis span{position:absolute;right:0;top:0;font:400 13px/30px var(--display);background:var(--ink);color:var(--bg);padding:0 12px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;border-left:10px solid var(--c,var(--accent));transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--c,var(--accent))}
.card b{font:400 20px/1.1 var(--display)}
.card span{color:var(--muted);font-size:15px}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-top:auto;padding-top:8px;color:var(--ink)}
.stars{letter-spacing:2px;color:var(--gold);font-size:18px;-webkit-text-stroke:.6px rgba(0,0,0,.25)}
.stars .off{color:var(--line);-webkit-text-stroke:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 24px;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn.sm{padding:6px 14px;font-size:14px;box-shadow:none}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.again{background:var(--bad-bg);color:var(--bad);box-shadow:none;border:2px solid var(--bad)}
.btn.got{background:var(--good-bg);color:var(--good);box-shadow:none;border:2px solid var(--good)}
.hear{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;display:inline-flex;gap:8px;align-items:center}
.hear svg{width:18px;height:18px;fill:currentColor}
.hud{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-weight:800;font-size:15px}
.prog{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.streak{color:var(--prperf);white-space:nowrap}
.qcard{background:var(--surface);border-radius:22px;padding:22px;border:2px solid var(--line);border-top:10px solid var(--c,var(--accent))}
.qtag{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--c,var(--accent));margin-bottom:8px}
.prompt{font:700 clamp(21px,4.4vw,28px)/1.3 var(--body);margin-bottom:18px}
.gap{display:inline-block;min-width:64px;border-bottom:4px solid var(--accent);margin:0 4px;transform:translateY(-3px)}
.bigverb{font:400 clamp(44px,12vw,72px)/1 var(--display);margin:4px 0 18px;color:var(--c,var(--accent))}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:700;font-size:18px}
.opt kbd{font:800 13px var(--body);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:1px 8px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled,.chunk:disabled{cursor:default}
.opt.good,.chunk.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.bad,.chunk.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.sentence{display:flex;flex-wrap:wrap;gap:8px}
.chunk{background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:19px}
.chunk:hover:not(:disabled){border-color:var(--accent);border-style:solid}
.fields{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.field{flex:1 1 180px;display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:14px;color:var(--muted)}
.field input{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:22px;font-weight:700;color:var(--ink);min-width:0}
.field input:focus{border-color:var(--accent);outline:none}
.field input.good{border-color:var(--good);background:var(--good-bg)}
.field input.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;border-radius:18px;padding:16px 18px;border:2px solid;animation:rise .25s ease-out}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fbh{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.fb.good .fbh strong{color:var(--good)}.fb.bad .fbh strong{color:var(--bad)}
.xp{font-weight:800;font-size:14px;background:var(--gold);color:#14213d;border-radius:99px;padding:2px 12px}
.why{margin:6px 0 4px}
.why p{margin:6px 0}
.forms{font-size:22px;font-weight:800}
.ex{color:var(--ink)}
.note{font-size:15px;color:var(--muted)}
mark.v{background:transparent;color:var(--accent);font-weight:800;border-bottom:3px solid var(--gold)}
.fbrow{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:10px;flex-wrap:wrap}
.tlf{margin:8px 0 0}
.tlf svg{width:100%;max-width:360px;height:auto;display:block}
.tl-axis{stroke:var(--line);stroke-width:3;fill:none}.tl-arrow{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}
.tl-now{stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3}
.tl-t{font:700 11px var(--body);fill:var(--muted)}.tl-t.now{fill:var(--ink)}
.score{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0 18px}
.big{font:400 clamp(50px,14vw,86px)/1 var(--display)}
.stars.lg{font-size:40px}
.review{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:14px 0}
.review h3{font-size:17px;margin-bottom:6px}
.review li{margin:4px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.fc{background:var(--surface);border:2px solid var(--line);border-top:10px solid var(--c,var(--pperf));border-radius:24px;padding:26px 22px;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;animation:flip .28s ease-out}
.fc small{font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fcv{font:400 clamp(48px,14vw,84px)/1 var(--display);color:var(--pperf)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.cols div{background:var(--bg);border-radius:14px;padding:10px 6px;min-width:0}
.cols small{display:block;font-size:11px}
.cols b{font:400 clamp(20px,5.2vw,32px)/1.15 var(--display);overflow-wrap:anywhere}
.cols div:nth-child(2) b{color:var(--psimple)}.cols div:nth-child(3) b{color:var(--prperf)}.cols div:nth-child(1) b{color:var(--pperf)}
.cols.two{grid-template-columns:repeat(2,1fr)}
.fcx{text-align:left;width:100%;max-width:520px}
.fcx p{margin:4px 0}
.ctl{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pill{display:inline-block;font-weight:800;font-size:13px;padding:2px 12px;border-radius:99px;background:var(--bg);border:2px solid var(--line);margin:2px 4px 2px 0}
.sec{background:var(--surface);border:2px solid var(--line);border-left:10px solid var(--c);border-radius:18px;padding:16px 18px;margin:14px 0}
.sec h2{font:400 22px/1.1 var(--display);color:var(--c);margin-bottom:4px}
.sec p{margin:6px 0}
.sec code{font:800 15px var(--body);background:var(--bg);padding:2px 8px;border-radius:8px}
.sec ul{margin:6px 0;padding-left:20px}
.sec li{margin:3px 0}
.mini{width:100%;border-collapse:collapse;font-size:15px}
.mini td,.mini th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
select{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;max-width:100%}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;margin:10px 0 2px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.roomcode{font:400 clamp(54px,16vw,96px)/1 var(--display);letter-spacing:.12em;color:var(--accent);background:var(--surface);border:3px dashed var(--line);border-radius:22px;text-align:center;padding:14px 8px 14px 20px;margin:10px 0 14px}
.board{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
.brow{display:grid;grid-template-columns:34px minmax(0,1.3fr) minmax(50px,1fr) 44px;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.brow.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.bk{font:400 22px var(--display);text-align:center;color:var(--prperf)}
.bn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bn small{font-weight:700;color:var(--muted);font-size:12px;margin-left:4px}
.bp{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bp i{display:block;height:100%;background:var(--accent);transition:width .3s}
.brow b{text-align:right;font-size:20px}
.rkx{font-weight:800;color:var(--accent);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;z-index:9;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flip{from{opacity:.2;transform:rotateX(70deg)}to{opacity:1;transform:none}}
@media (max-width:520px){
  .zone{padding:10px}.zone b{font-size:15px}.zone code{font-size:11px}.zone em{font-size:13px}
  .lv{min-width:120px}.qcard{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var app=$('#app');
var KEY='tenseTraveller.v2';
var ALL={profiles:{},last:''};
var S=null;
function blank(n){return {name:n,xp:0,cards:{},best:{}};}
function clean(o,n){
  var p=blank(n);
  p.xp=Math.max(0,Math.min(1000000,Math.floor(+o.xp||0)));
  var c=o.cards||{},b=o.best||{};
  Object.keys(c).slice(0,300).forEach(function(k){var v=Math.floor(+c[k]);if(k.length<=30&&v>=0&&v<=3)p.cards[k]=v;});
  ['vault','duel','time','hunt','sound','boss'].forEach(function(k){var v=Math.floor(+b[k]);if(v>=0&&v<=3)p.best[k]=v;});
  return p;
}
try{
  var r2=localStorage.getItem(KEY);
  if(r2){var A=JSON.parse(r2);Object.keys(A.profiles||{}).forEach(function(k){ALL.profiles[k]=clean(A.profiles[k],k);});ALL.last=A.last||'';}
  else{var r1=localStorage.getItem('tenseTraveller.v1');if(r1){var o1=JSON.parse(r1);if(o1.xp>0||o1.name){var nm=(o1.name||'Traveller').slice(0,20);ALL.profiles[nm]=clean(o1,nm);ALL.last=nm;}}}
}catch(e){}
function save(){
  if(S){ALL.profiles[S.name]=S;ALL.last=S.name;}
  try{localStorage.setItem(KEY,JSON.stringify(ALL));}catch(e){}
}
function makeCode(){return 'TT1-'+btoa(unescape(encodeURIComponent(JSON.stringify({n:S.name,x:S.xp,c:S.cards,b:S.best}))));}
function readCode(str){
  str=(str||'').replace(/\s+/g,'');
  if(str.indexOf('TT1-')!==0)return null;
  var o;try{o=JSON.parse(decodeURIComponent(escape(atob(str.slice(4)))));}catch(e){return null;}
  if(!o||typeof o.n!=='string')return null;
  var n=o.n.replace(/[<>&"]/g,'').trim().slice(0,20);
  if(!n)return null;
  return clean({xp:o.x,cards:o.c,best:o.b},n);
}
function login(name){S=ALL.profiles[name];save();go('home');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(s){return s.replace(/\*(.+?)\*/g,'<mark class="v">$1</mark>');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
var HAS_TTS=('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined');
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.8;speechSynthesis.speak(u);}catch(e){}}
var SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
function hearBtn(t){return HAS_TTS?'<button class="hear" data-act="say" data-say="'+esc(t)+'">'+SPK+'Hear it</button>':'';}

/* ---------- DATA ---------- */
var FAMILIES={
  aaa:{t:'Same, same, same',d:'cut, cut, cut'},
  abb:{t:'Two the same',d:'buy, bought, bought'},
  aba:{t:'Base comes back',d:'run, ran, run'},
  abc:{t:'All different',d:'go, went, gone'}
};
// base, past simple, past participle, family, example (past simple), example (present perfect), optional note
var IRR=[
['cut','cut','cut','aaa','Dad *cut* the grass.','I have *cut* my finger.'],
['put','put','put','aaa','She *put* her bag on the chair.','Who has *put* my pencil case here?'],
['hit','hit','hit','aaa','He *hit* the ball very hard.','The ball has *hit* the window!'],
['let','let','let','aaa','Mum *let* me stay up late.','She has never *let* me borrow her bike.'],
['set','set','set','aaa','We *set* the table for dinner.','He has *set* a new school record.'],
['shut','shut','shut','aaa','I *shut* the door quietly.','Someone has *shut* the window.'],
['hurt','hurt','hurt','aaa','I *hurt* my knee playing football.','Have you *hurt* yourself?'],
['cost','cost','cost','aaa','The trainers *cost* sixty euros.','That game has *cost* me all my pocket money.'],
['read','read','read','aaa','She *read* the whole book in a day.','I have *read* that book three times.','The spelling does not change, but the past forms sound like "red".'],
['quit','quit','quit','aaa','He *quit* the team last year.','She has *quit* eating sweets.'],
['spread','spread','spread','aaa','The news *spread* fast.','The fire has *spread* to the forest.'],
['bring','brought','brought','abb','She *brought* her dog to school.','Have you *brought* your book?'],
['buy','bought','bought','abb','I *bought* a new bag yesterday.','He has *bought* tickets for the concert.'],
['catch','caught','caught','abb','The goalkeeper *caught* the ball.','They have *caught* a big fish.'],
['teach','taught','taught','abb','Ms Lopez *taught* us a new song.','She has *taught* English for ten years.'],
['think','thought','thought','abb','I *thought* the test was easy.','I have *thought* about it a lot.'],
['build','built','built','abb','They *built* a snowman.','My uncle has *built* a house.'],
['make','made','made','abb','Grandma *made* pancakes.','We have *made* a poster.'],
['say','said','said','abb','He *said* hello and smiled.','She has *said* sorry twice.'],
['pay','paid','paid','abb','Dad *paid* for lunch.','I have already *paid* for the tickets.'],
['sell','sold','sold','abb','They *sold* their old car.','The shop has *sold* all the bikes.'],
['tell','told','told','abb','She *told* us a funny story.','I have *told* you three times!'],
['find','found','found','abb','I *found* a coin in the park.','Have you *found* your keys?'],
['have','had','had','abb','We *had* pizza for dinner.','I have *had* this phone for a year.'],
['hear','heard','heard','abb','I *heard* a strange noise.','Have you *heard* the news?'],
['hold','held','held','abb','He *held* the baby carefully.','She has *held* the record since 2022.'],
['keep','kept','kept','abb','She *kept* the letter in a box.','I have *kept* all your messages.'],
['leave','left','left','abb','They *left* the party early.','The train has already *left*.'],
['lend','lent','lent','abb','I *lent* him my bike.','Have you *lent* her your pen?'],

var LEVELS=[[0,'Time Tourist'],[120,'Verb Explorer'],[300,'Tense Traveller'],[550,'Timeline Ranger'],[850,'Past Perfect Pilot'],[1250,'Time Master']];

  var L=lvl(),lo=LEVELS[L][0],nxt=LEVELS[L+1];

  $('#top').innerHTML='<div class="topin"><button class="brand" data-act="home">Tense Traveller</button><div class="lv"><div class="lvl"><b>'+LEVELS[L][1]+'</b><span>'+S.xp+' XP'+(nxt?' / '+nxt[0]:'')+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div></div>';
}

function viewGuide(){
  app.innerHTML=back()+'<h1 class="h1">Tense Map</h1><p class="lead">Three tenses, three jobs. Use the colours to remember them: purple for earlier, blue for finished, orange for connected to now.</p>'+
  '<section class="sec" style="--c:var(--psimple)"><h2>Past simple</h2><p>A finished action at a finished time.</p><p><code>verb + -ed</code> or the 2nd form of an irregular verb. Questions and negatives: <code>did / didn\'t + base verb</code>.</p><p><span class="pill">yesterday</span><span class="pill">last week</span><span class="pill">in 2019</span><span class="pill">two days ago</span><span class="pill">when I was ten</span></p><p>We <b>watched</b> a film last night.</p>'+timeline('simple')+'</section>'+
  '<section class="sec" style="--c:var(--prperf)"><h2>Present perfect</h2><p>A past action or state that is connected to now: experience, a result you can see, or something that is still true.</p><p><code>have / has + past participle</code></p><p><span class="pill">ever</span><span class="pill">never</span><span class="pill">already</span><span class="pill">yet</span><span class="pill">just</span><span class="pill">since</span><span class="pill">for</span><span class="pill">so far</span><span class="pill">today / this week</span></p><p>I <b>have lost</b> my keys. (I still do not have them.)</p><p>Careful: she <b>has been</b> to Rome (she came back). She <b>has gone</b> to Rome (she is still there).</p>'+timeline('presperf')+'</section>'+
  '<section class="sec" style="--c:var(--pperf)"><h2>Past perfect</h2><p>The earlier of two past actions. It is the "before then" tense.</p><p><code>had + past participle</code></p><p><span class="pill">by the time</span><span class="pill">before</span><span class="pill">after</span><span class="pill">already</span><span class="pill">because</span><span class="pill">she said that...</span></p><p>When I arrived, the film <b>had started</b>.</p>'+timeline('pperf')+'</section>'+
  '<section class="sec" style="--c:var(--pperf)"><h2>Irregular verb families</h2><table class="mini"><tbody>'+Object.keys(FAMILIES).map(function(k){var ex=IRR.filter(function(v){return v[3]===k;}).slice(0,6).map(function(v){return v[0];}).join(', ');return '<tr><th>'+FAMILIES[k].t+'</th><td>'+FAMILIES[k].d+'<br><span class="note">'+ex+'...</span></td></tr>';}).join('')+'</tbody></table></section>'+
  '<section class="sec" style="--c:var(--psimple)"><h2>Regular verbs: spelling and sound</h2><ul>'+Object.keys(RULES).map(function(k){return '<li>'+RULES[k]+'</li>';}).join('')+'</ul><p><b>Sounds:</b> /t/ after p, k, f, s, sh, ch (walked). /d/ after other sounds (played). /ɪd/ after t or d (wanted).</p></section>';
}

/* ---------- FLASHCARDS ---------- */
function cardsFor(id){
  if(id==='reg')return REG.map(function(v){return {id:v[0],t:'reg',v:v};});
  var list=id==='all'?IRR:IRR.filter(function(v){return v[3]===id;});
  return list.map(function(v){return {id:v[0],t:'irr',v:v};});
}
function viewVault(){
  var decks=[['all','Every irregular verb','All '+IRR.length+' irregular verbs']].concat(Object.keys(FAMILIES).map(function(k){return [k,FAMILIES[k].t,FAMILIES[k].d];})).concat([['reg','Regular verbs','Spelling rules for -ed']]);
  app.innerHTML=back()+'<h1 class="h1">Verb Vault</h1><p class="lead">Pick a deck. Each session has up to 12 cards. Cards you miss come back sooner. Get a card right three times to master it.</p><div class="grid">'+
  decks.map(function(d){var cs=cardsFor(d[0]);var m=cs.filter(function(c){return (S.cards[c.id]||0)>=3;}).length;
    return '<button class="card" style="--c:var(--pperf)" data-act="deck" data-deck="'+d[0]+'"><b>'+d[1]+'</b><span>'+d[2]+'</span><div class="bar" style="margin-top:8px"><i style="width:'+Math.round(m/cs.length*100)+'%"></i></div><div class="meta"><span>'+m+' / '+cs.length+' mastered</span></div></button>';}).join('')+'</div>';
}
function startDeck(id){
  var pool=cardsFor(id);
  var q=shuffle(pool).sort(function(a,b){return (S.cards[a.id]||0)-(S.cards[b.id]||0);}).slice(0,12);
  F={deck:id,q:q,i:0,flipped:false,got:0,again:0,active:true,re:{}};
  renderCard();
}
function renderCard(){
  if(F.i>=F.q.length){return endDeck();}
  var c=F.q[F.i],v=c.v,body;
  var pct=Math.round(F.i/F.q.length*100);
  var hud='<div class="hud"><button class="link" data-act="vault">← Decks</button><div class="prog"><span style="width:'+pct+'%"></span></div><div>'+(F.i+1)+'/'+F.q.length+'</div></div>';
  if(!F.flipped){
    body='<div class="fc"><small>'+(c.t==='reg'?'Regular verb':'Irregular verb')+'</small><div class="fcv">'+v[0]+'</div><p>'+(c.t==='reg'?'Say the past simple and spell it. Then flip.':'Say the past simple and past participle. Then flip.')+'</p></div><div class="ctl"><button class="btn" data-act="flip">Flip card <span style="opacity:.7">(Space)</span></button></div>';
  }else if(c.t==='reg'){
    body='<div class="fc"><small>Regular verb</small><div class="cols two"><div><small>Base</small><b>'+v[0]+'</b></div><div><small>Past simple</small><b>'+v[1]+'</b></div></div><div class="fcx"><p><b>Rule:</b> '+RULES[v[2]]+'</p><p>'+fmt(v[3])+'</p></div>'+hearBtn(v[0]+'. '+v[1]+'.')+'</div>';
  }else{
    body='<div class="fc"><small>Irregular verb</small><div class="cols"><div><small>Base</small><b>'+v[0]+'</b></div><div><small>Past simple</small><b>'+v[1]+'</b></div><div><small>Past participle</small><b>'+v[2]+'</b></div></div><div class="fcx"><p>'+fmt(v[4])+'</p><p>'+fmt(v[5])+'</p>'+(v[6]?'<p class="note">'+v[6]+'</p>':'')+'</div>'+hearBtn(v[0]+'. '+v[1]+'. '+v[2]+'.')+'</div>';
  }
  if(F.flipped)body+='<div class="ctl"><button class="btn again" data-act="again">Again (←)</button><button class="btn got" data-act="got">Got it (→)</button></div>';
  app.innerHTML=hud+body;
}
function endDeck(){
  F.active=false;
  app.innerHTML='<h1 class="h1">Session complete</h1><div class="score"><div class="big">'+F.got+'</div><div><b>cards you knew</b><br><span class="note">'+F.again+' to see again soon</span></div></div><div class="actions"><button class="btn" data-act="deck" data-deck="'+F.deck+'">Another session</button><button class="btn alt" data-act="vault">Choose a deck</button><button class="btn alt" data-act="home">Home</button></div>';
}

/* ---------- QUESTION BUILDERS ---------- */
function qIrr(v){
  return {kind:'type',tag:'duel',tagLabel:'Verb Duel',prompt:'Type the past forms of',big:v[0],
    fields:[{label:'Past simple',ans:v[1]},{label:'Past participle',ans:v[2]}],
    why:'<div class="forms">'+v[0]+' → '+v[1]+' → '+v[2]+'</div><p class="ex">'+fmt(v[4])+'<br>'+fmt(v[5])+'</p>'+(v[6]?'<p class="note">'+v[6]+'</p>':''),
    say:v[0]+'. '+v[1]+'. '+v[2]+'.',review:v[0]+' – '+v[1]+' – '+v[2]};
}
function qReg(v){
  return {kind:'type',tag:'duel',tagLabel:'Regular -ed spelling',prompt:'Type the past simple of',big:v[0],
    fields:[{label:'Past simple (-ed)',ans:v[1]}],
    why:'<div class="forms">'+v[0]+' → '+v[1]+'</div><p>'+RULES[v[2]]+'</p><p class="ex">'+fmt(v[3])+'</p>',
    say:v[0]+'. '+v[1]+'.',review:v[0]+' – '+v[1]};
}
function qTM(t){
  var opts=shuffle(t[1].map(function(o,i){return {o:o,c:i===0};}));
  return {kind:'choice',tag:'time',tagLabel:'Time Machine',
    prompt:'Choose the best answer.<br><span class="sent">'+esc(t[0]).replace('___','<span class="gap"></span>')+'</span>',
    options:opts.map(function(x){return esc(x.o);}),ans:opts.findIndex(function(x){return x.c;}),
    why:'<p>'+t[3]+'</p>',tl:t[2],say:t[0].replace('___',t[1][0]),review:esc(t[0]).replace('___','<b>'+esc(t[1][0])+'</b>')};
}
function qHunt(h){
  var fixed=h[0].map(function(c,i){return i===h[1]?h[2]:c;}).join(' ');
  return {kind:'chunks',tag:'hunt',tagLabel:'Error Hunter',prompt:'One part of this sentence has a mistake. Tap it.',
    options:h[0],ans:h[1],
    why:'<p>Better: <b>'+esc(fixed)+'</b></p><p>'+h[3]+'</p>',say:fixed,review:esc(fixed)};
}
function qSound(w){
  return {kind:'choice',tag:'sound',tagLabel:'Sound Lab',prompt:'How do you say the ending of',big:w[0],
    options:SOUND_OPT,ans:w[1],why:'<p><b>'+w[0]+'</b>: '+SOUND_WHY[w[1]]+'</p>',say:w[0],review:w[0]+' '+['/t/','/d/','/ɪd/'][w[1]]};
}
function soundPool(){var a=[];SOUND_LISTS.forEach(function(l,i){l.forEach(function(w){a.push([w,i]);});});return a;}
function build(mode,set){
  if(mode==='duel'){
    if(set==='reg')return pick(REG,10).map(qReg);
    var pool=set==='mix'?IRR:IRR.filter(function(v){return set==='abc'?(v[3]==='abc'||v[3]==='aba'):v[3]===set;});
    return pick(pool,10).map(qIrr);
  }
  if(mode==='time')return pick(TM,10).map(qTM);
  if(mode==='hunt')return pick(HUNT,10).map(qHunt);
  if(mode==='sound')return pick(soundPool(),12).map(qSound);
  return shuffle([].concat(pick(TM,5).map(qTM),pick(HUNT,4).map(qHunt),pick(IRR.filter(function(v){return v[3]==='abc'||v[3]==='abb';}),3).map(qIrr),pick(soundPool(),2).map(qSound)));
}
var COLORS={duel:'--psimple',time:'--prperf',hunt:'--pperf',sound:'--psimple',boss:'--accent'};
var PRAISE=['Spot on!','Brilliant!','Yes!','Perfect!','Nice one!','You got it!'];
var OOPS=['Not quite.','Close. Check this.','Good try.','Almost.'];

/* ---------- QUIZ ENGINE ---------- */
function viewDuel(){
  var sets=[['mix','Mixed irregulars','Every irregular verb'],['aaa',FAMILIES.aaa.t,FAMILIES.aaa.d],['abb',FAMILIES.abb.t,FAMILIES.abb.d],['abc','All different','go, went, gone and run, ran, run'],['reg','Regular -ed spelling','double letters, y to ied and more']];
  app.innerHTML=back()+'<h1 class="h1">Verb Duel</h1><p class="lead">Choose a set. You get 10 verbs. Type the forms and press Enter. Where a verb has two answers, either one counts.</p><div class="grid">'+
   sets.map(function(s){return '<button class="card" style="--c:var(--psimple)" data-act="play" data-mode="duel" data-set="'+s[0]+'"><b>'+s[1]+'</b><span>'+s[2]+'</span></button>';}).join('')+'</div>';
}
function startRound(mode,set){
  R={mode:mode,set:set||'',qs:build(mode,set),i:0,score:0,streak:0,wrong:[],xp:0,answered:false,active:true};
  renderQ();
}
function renderQ(){
  var q=R.qs[R.i],body='';R.answered=false;
  var c=COLORS[q.tag==='duel'?'duel':q.tag==='time'?'time':q.tag==='hunt'?'hunt':'sound'];
  if(q.kind==='choice'){
    body='<div class="opts">'+q.options.map(function(o,i){return '<button class="opt" data-act="opt" data-i="'+i+'"><kbd>'+(i+1)+'</kbd><span>'+o+'</span></button>';}).join('')+'</div>';
  }else if(q.kind==='chunks'){
    body='<div class="sentence">'+q.options.map(function(o,i){return '<button class="chunk" data-act="opt" data-i="'+i+'">'+esc(o)+'</button>';}).join('')+'</div>';
  }else{
    body='<form id="tf" autocomplete="off"><div class="fields">'+q.fields.map(function(f,i){return '<label class="field">'+f.label+'<input id="f'+i+'" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="'+f.label+'"></label>';}).join('')+'</div><button class="btn" type="submit">Check</button></form>';
  }
  app.innerHTML='<div class="hud"><button class="link" data-act="home">'+(R.multi?'Leave':'Quit')+'</button><div class="prog"><span style="width:'+Math.round(R.i/R.qs.length*100)+'%"></span></div><div>'+(R.i+1)+'/'+R.qs.length+'</div><div class="streak" id="stk">Streak '+R.streak+'</div>'+(R.multi?'<div class="rkx" id="rk"></div>':'')+'</div>'+
   '<div class="qcard" style="--c:var('+c+')"><div class="qtag">'+q.tagLabel+'</div><div class="prompt">'+q.prompt+'</div>'+(q.big?'<div class="bigverb">'+q.big+'</div>':'')+body+'</div><div id="fb" aria-live="polite"></div>';
  if(q.kind==='type'){$('#f0').focus();}
  if(R.multi)updateRank();
}
function norm(s){return s.toLowerCase().replace(/[‘’]/g,"'").trim();}
function matches(val,ans){var v=norm(val);if(!v)return false;return norm(ans).split('/').concat([norm(ans)]).indexOf(v)>-1;}
function answerChoice(i){
  var q=R.qs[R.i];if(R.answered)return;R.answered=true;
  var ok=i===q.ans;
  var els=app.querySelectorAll('.opt,.chunk');
  Array.prototype.forEach.call(els,function(b,k){b.disabled=true;if(k===q.ans)b.classList.add('good');else if(k===i)b.classList.add('bad');});
  finish(ok,q);
}
function answerType(){
  var q=R.qs[R.i];if(R.answered)return;
  var allOk=true,empty=false;
  q.fields.forEach(function(f,i){var inp=$('#f'+i);if(!inp.value.trim())empty=true;});
  if(empty){toast('Fill in every box first.');return;}
  R.answered=true;
  q.fields.forEach(function(f,i){var inp=$('#f'+i);var ok=matches(inp.value,f.ans);if(!ok)allOk=false;inp.classList.add(ok?'good':'bad');inp.disabled=true;});
  var sb=$('#tf .btn');if(sb)sb.style.display='none';
  finish(allOk,q);
}
function finish(ok,q){
  var gain=0;
  if(ok){gain=10+Math.min(R.streak,4)*2;R.score++;R.streak++;R.xp+=gain;addXP(gain);}
  else{R.streak=0;R.wrong.push(q);}
  var s=$('#stk');if(s)s.textContent='Streak '+R.streak;
  if(R.multi)mpProgress(false);
  var last=R.i+1>=R.qs.length;
  $('#fb').innerHTML='<div class="fb '+(ok?'good':'bad')+'"><div class="fbh"><strong>'+rnd(ok?PRAISE:OOPS)+'</strong>'+(ok?'<span class="xp">+'+gain+' XP</span>':'')+'</div><div class="why">'+q.why+'</div>'+(q.tl?timeline(q.tl):'')+'<div class="fbrow">'+hearBtn(q.say)+'<button class="btn" id="nx" data-act="next">'+(last?'See results':'Next')+'</button></div></div>';
  var nx=$('#nx');if(nx){nx.focus({preventScroll:false});}
}
function results(){
  var n=R.qs.length,r=R.score/n,stars=r>=.9?3:r>=.7?2:r>=.5?1:0;
  var bonus=0;
  if(stars===3){bonus=R.mode==='boss'?50:25;addXP(bonus);}
  S.best[R.mode]=Math.max(S.best[R.mode]||0,stars);save();
  var msg=['Every expert starts somewhere. Check the list below and try again.','Good start. Review the list and play once more.','Great work. Nearly there!','Perfect round. You are a past-tense pro!'][stars];
  var review=R.wrong.length?'<div class="review"><h3>Practise these</h3><ul>'+R.wrong.map(function(q){return '<li>'+q.review+'</li>';}).join('')+'</ul></div>':'';
  app.innerHTML='<h1 class="h1">Round complete</h1><div class="score"><div class="big">'+R.score+'/'+n+'</div><div>'+starsHTML(stars).replace('class="stars"','class="stars lg"')+'<br><b>+'+(R.xp+bonus)+' XP</b>'+(bonus?' <span class="note">(includes '+bonus+' bonus)</span>':'')+'</div></div><p class="lead">'+msg+'</p>'+review+
   '<div class="actions"><button class="btn" data-act="again2">Play again</button><button class="btn alt" data-act="home">Home</button></div>';
  R.active=false;
}


/* ---------- MULTIPLAYER (peer to peer, PeerJS) ---------- */
var MP=null;
var PFX='tensetraveller-',CODE_CH='BCDFGHJKLMNPQRSTVWXZ';
function newCode(){var c='';for(var i=0;i<4;i++)c+=CODE_CH.charAt(Math.floor(Math.random()*CODE_CH.length));return c;}
function peerOK(){return typeof window.Peer==='function';}
function mpLeave(){
  var m=MP;MP=null;if(!m)return;
  clearTimeout(m.timer);
  try{if(m.peer)m.peer.destroy();}catch(e){}
}
function myName(m){return m.role==='host'?S.name:m.myName;}
function hostPlayer(){return {name:S.name,s:0,i:0,d:false,ms:0,host:true};}
function nameTaken(m,nm){
  var low=nm.toLowerCase();
  if(low===S.name.toLowerCase())return true;
  return Object.keys(m.players).some(function(id){return m.players[id].name.toLowerCase()===low;});
}
function rowsOf(m){
  return Object.keys(m.players).map(function(id){var p=m.players[id];return {n:p.name,s:p.s,i:p.i,d:p.d,ms:p.ms,h:!!p.host,l:!!p.l};})
   .sort(function(a,b){if(b.s!==a.s)return b.s-a.s;if(a.d!==b.d)return a.d?-1:1;if(a.d&&b.d&&a.ms!==b.ms)return a.ms-b.ms;return a.n<b.n?-1:1;});
}
function sendAll(m,msg){Object.keys(m.conns).forEach(function(id){try{m.conns[id].send(msg);}catch(e){}});}
function lobbyList(m){return Object.keys(m.players).map(function(id){return {n:m.players[id].name,h:!!m.players[id].host};});}
function lobbyBroadcast(m){sendAll(m,{t:'lobby',list:lobbyList(m)});mpRefresh(m);}
function mpRefresh(m){
  if(MP!==m)return;
  if(R&&R.active&&R.multi)updateRank();else viewRoom();
}
function updateRank(){
  var el=$('#rk');if(!el||!MP)return;
  var rows=MP.role==='host'?rowsOf(MP):(MP.board||[]);
  var k=rows.map(function(r){return r.n;}).indexOf(myName(MP));
  el.textContent=k>-1&&rows.length>1?'Rank '+(k+1)+'/'+rows.length:'';
}
function hostRoom(){
  if(!peerOK()){toast('Multiplayer could not load. Check your internet connection and refresh the page.');return;}
  mpLeave();
  var m=MP={role:'host',code:'',peer:null,conns:{},players:{host:hostPlayer()},phase:'lobby',teacherPlays:true,mode:'time',set:'',n:10,board:[],status:'Opening your room...',qs:null,played:false,awarded:false};
  var tries=0;
  (function open(){
    m.code=newCode();
    var p;
    try{p=new Peer(PFX+m.code,{debug:0});}catch(e){toast('Could not start multiplayer on this page.');mpLeave();go('together');return;}
    m.peer=p;
    clearTimeout(m.timer);
    m.timer=setTimeout(function(){if(MP===m&&m.status){toast('Could not open a room. Multiplayer works from the GitHub Pages link, with an internet connection.');mpLeave();go('together');}},12000);
    p.on('open',function(){if(MP!==m)return;clearTimeout(m.timer);m.status='';viewRoom();});
    p.on('error',function(err){
      if(MP!==m)return;
      if(err&&err.type==='unavailable-id'&&tries++<5){try{p.destroy();}catch(e){}open();return;}
      toast('Could not open a room ('+(err&&err.type||'error')+'). Check your internet connection.');mpLeave();go('together');
    });
    p.on('connection',function(c){hostConn(m,c);});
  })();
  viewRoom();
}
function hostConn(m,c){
  c.on('data',function(d){
    if(MP!==m||!d)return;
    if(d.t==='hello'){
      if(m.phase!=='lobby'){c.send({t:'err',msg:'The game has already started. Wait for the next one.'});return;}
      if(Object.keys(m.players).length>=16){c.send({t:'err',msg:'The room is full.'});return;}
      var nm=String(d.name||'Player').replace(/[<>&"]/g,'').trim().slice(0,20)||'Player',base=nm,k=2;
      while(nameTaken(m,nm))nm=base+' '+(k++);
      m.conns[c.peer]=c;m.players[c.peer]={name:nm,s:0,i:0,d:false,ms:0,host:false};
      c.send({t:'welcome',name:nm});
      lobbyBroadcast(m);
    }else if(d.t==='p'&&m.players[c.peer]&&m.phase==='play'){
      var pl=m.players[c.peer];
      pl.i=Math.max(0,Math.min(Math.floor(+d.i||0),m.n));pl.s=Math.max(0,Math.min(Math.floor(+d.s||0),m.n));pl.d=!!d.d;pl.ms=Math.max(0,+d.ms||0);
      boardBroadcast(m);
    }
  });
  c.on('close',function(){
    if(MP!==m)return;
    var pl=m.players[c.peer];delete m.conns[c.peer];
    if(!pl)return;
    if(m.phase==='lobby'){delete m.players[c.peer];lobbyBroadcast(m);}
    else{pl.l=true;pl.d=true;if(m.phase==='play')boardBroadcast(m);else mpRefresh(m);}
  });
}
function startGame(m){
  var guests=Object.keys(m.players).filter(function(id){return !m.players[id].host;}).length;
  if(!m.teacherPlays&&guests===0){toast('Wait for at least one player to join.');return;}
  if(m.teacherPlays)m.players.host=m.players.host||hostPlayer();else delete m.players.host;
  Object.keys(m.players).forEach(function(id){var p=m.players[id];p.s=0;p.i=0;p.d=false;p.ms=0;p.l=false;});
  m.qs=build(m.mode,m.set);m.n=m.qs.length;m.phase='play';m.awarded=false;m.played=false;
  sendAll(m,{t:'start',qs:m.qs,n:m.n});
  if(m.teacherPlays)beginLocal(m);else viewRoom();
}
function beginLocal(m){
  m.played=true;m.myDone=false;
  R={mode:m.mode,set:m.set,qs:m.qs,i:0,score:0,streak:0,wrong:[],xp:0,answered:false,active:true,multi:true,t0:Date.now()};
  renderQ();
}
function boardBroadcast(m){
  var rows=rowsOf(m);m.board=rows;
  if(rows.length&&rows.every(function(r){return r.d;})){finishGame(m);return;}
  sendAll(m,{t:'board',rows:rows,n:m.n});
  mpRefresh(m);
}
function finishGame(m){
  m.phase='over';
  var rows=rowsOf(m);m.board=rows;
  sendAll(m,{t:'over',rows:rows,n:m.n});
  if(R&&R.multi){R.active=false;R=null;}
  mpOverAward(m);mpRefresh(m);
}
function mpOverAward(m){
  if(m.awarded||!m.played)return;m.awarded=true;
  var rows=m.role==='host'?rowsOf(m):m.board;
  var k=rows.map(function(r){return r.n;}).indexOf(myName(m));
  if(rows.length>1&&k>-1&&k<3){var b=[30,20,10][k];addXP(b);toast('Podium bonus: +'+b+' XP');}
}
function mpProgress(done){
  if(!MP||!R||!R.multi)return;
  var n=R.qs.length;
  var msg={t:'p',i:Math.min(R.i+(done?0:1),n),s:R.score,d:!!done,ms:Date.now()-R.t0};
  if(MP.role==='host'){var h=MP.players.host;if(h){h.i=msg.i;h.s=msg.s;h.d=msg.d;h.ms=msg.ms;}boardBroadcast(MP);}
  else{try{MP.conn.send(msg);}catch(e){}}
}
function mpDone(){
  R.active=false;
  if(MP)MP.myDone=true;
  mpProgress(true);
  if(MP)viewRoom();
}
function joinRoom(code){
  code=(code||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(code.length!==4){toast('Type the 4-letter room code.');return;}
  if(!peerOK()){toast('Multiplayer could not load. Check your internet connection and refresh the page.');return;}
  mpLeave();
  var m=MP={role:'guest',code:code,peer:null,conn:null,phase:'connecting',list:[],board:[],n:0,myName:S.name,played:false,awarded:false};
  var fail=function(msg){if(MP!==m)return;toast(msg);mpLeave();go('together');};
  m.timer=setTimeout(function(){if(MP===m&&m.phase==='connecting')fail('Could not reach that room. Check the code and your internet connection.');},12000);
  var p;
  try{p=new Peer({debug:0});}catch(e){fail('Could not start multiplayer on this page.');return;}
  m.peer=p;
  p.on('open',function(){
    if(MP!==m)return;
    var c=p.connect(PFX+code,{reliable:true});m.conn=c;
    c.on('open',function(){c.send({t:'hello',name:S.name});});
    c.on('data',function(d){guestMsg(m,d);});
    c.on('close',function(){fail('The room was closed.');});
  });
  p.on('error',function(err){fail(err&&err.type==='peer-unavailable'?'Room not found. Check the code with your teacher.':'Connection problem ('+(err&&err.type||'error')+').');});
  viewRoom();
}
function guestMsg(m,d){
  if(MP!==m||!d)return;
  if(d.t==='welcome'){clearTimeout(m.timer);m.phase='lobby';m.myName=d.name;}
  else if(d.t==='err'){clearTimeout(m.timer);toast(d.msg);mpLeave();go('together');return;}
  else if(d.t==='lobby'){m.list=d.list||[];if(m.phase!=='connecting'){m.phase='lobby';R=null;}}
  else if(d.t==='start'){
    m.phase='play';m.n=d.n;m.awarded=false;m.played=true;m.myDone=false;m.board=[];
    R={mode:'mp',set:'',qs:d.qs,i:0,score:0,streak:0,wrong:[],xp:0,answered:false,active:true,multi:true,t0:Date.now()};
    renderQ();return;
  }
  else if(d.t==='board'){m.board=d.rows||[];m.n=d.n;}
  else if(d.t==='over'){m.board=d.rows||[];m.phase='over';if(R&&R.multi){R.active=false;R=null;}mpOverAward(m);}
  mpRefresh(m);
}
function pills(list){return '<div>'+list.map(function(x){return '<span class="pill">'+esc(x.n)+(x.h?' (teacher)':'')+'</span>';}).join('')+'</div>';}
function boardRows(rows,n,me){
  return '<ol class="board">'+rows.map(function(r,k){
    return '<li class="brow'+(r.n===me?' me':'')+'"><span class="bk">'+(k+1)+'</span><span class="bn">'+esc(r.n)+(r.h?'<small>teacher</small>':'')+(r.l?'<small>left</small>':'')+'</span><span class="bp"><i style="width:'+Math.round(Math.min(1,r.i/(n||1))*100)+'%"></i></span><b>'+r.s+'</b></li>';
  }).join('')+'</ol>';
}
function viewTogether(){
  app.innerHTML=back()+'<h1 class="h1">Play Together</h1><p class="lead">Everyone answers the same questions at the same time and a live scoreboard shows who is ahead. The teacher opens a room, and students join with a 4-letter code.</p>'+
   '<div class="grid"><section class="sec" style="--c:var(--prperf)"><h2>Open a room</h2><p>For the teacher. You can play too.</p><button class="btn" data-act="host">Open a room</button></section>'+
   '<section class="sec" style="--c:var(--psimple)"><h2>Join a room</h2><form id="jf" autocomplete="off"><div class="fields"><label class="field">Room code<input id="jc" type="text" maxlength="4" placeholder="ABCD" autocapitalize="characters" style="text-transform:uppercase"></label></div><button class="btn" type="submit">Join</button></form></section></div>'+
   '<p class="note">Playing as <b>'+esc(S.name)+'</b>. Everyone needs the internet and the same web link of this game.</p>';
}
function waitView(msg){return '<h1 class="h1">'+msg+'</h1><div class="actions"><button class="btn alt" data-act="home">Cancel</button></div>';}
function viewRoom(){
  var m=MP;if(!m){go('together');return;}
  var h='';
  if(m.role==='host'){
    if(m.status)h=waitView(m.status);
    else if(m.phase==='lobby'){
      var link=location.href.split('#')[0].split('?')[0];
      var opts=[['time|','Time Machine'],['hunt|','Error Hunter'],['duel|mix','Verb Duel: irregular verbs'],['duel|reg','Verb Duel: regular -ed spelling'],['sound|','Sound Lab'],['boss|','Mixed Challenge']];
      var cur=m.mode+'|'+m.set;
      h='<h1 class="h1">Your room</h1><div class="roomcode" aria-label="Room code">'+m.code+'</div>'+
        '<p class="lead">Students open <b>'+esc(link)+'</b>, choose Play Together, then Join a room, and type this code.</p>'+
        '<section class="sec" style="--c:var(--psimple)"><h2>Players ('+Object.keys(m.players).length+')</h2>'+pills(lobbyList(m))+'</section>'+
        '<section class="sec" style="--c:var(--prperf)"><h2>Game</h2><label class="field">Choose a game<select id="mpmode">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></label><label class="chk"><input type="checkbox" id="mptp"'+(m.teacherPlays?' checked':'')+'> I want to play too</label></section>'+
        '<div class="actions"><button class="btn" data-act="mpstart">Start game</button><button class="btn alt" data-act="home">Close room</button></div>';
    }else h=boardView(m);
  }else{
    if(m.phase==='connecting')h=waitView('Joining room '+esc(m.code)+'...');
    else if(m.phase==='lobby')h='<h1 class="h1">Room '+esc(m.code)+'</h1><p class="lead">You are in as <b>'+esc(m.myName)+'</b>. Waiting for the teacher to start the game.</p><section class="sec" style="--c:var(--psimple)"><h2>Players ('+m.list.length+')</h2>'+pills(m.list)+'</section><div class="actions"><button class="btn alt" data-act="home">Leave room</button></div>';
    else h=boardView(m);
  }
  app.innerHTML=h;
}
function boardView(m){
  var rows=m.role==='host'?rowsOf(m):(m.board||[]);
  var me=myName(m),over=m.phase==='over';
  var title=over?'Final results':(m.played&&m.myDone?'You finished!':(m.played?'Live scoreboard':'Live scoreboard (you are watching)'));
  var sub=over?'':(m.played&&m.myDone?'<p class="lead">Waiting for the others to finish.</p>':'');
  var k=rows.map(function(r){return r.n;}).indexOf(me);
  if(over&&m.played&&k>-1&&rows.length>1)sub='<p class="lead">You finished <b>'+(k+1)+(['st','nd','rd'][k]||'th')+'</b> of '+rows.length+'.</p>';
  var btns=m.role==='host'?(over?'<button class="btn" data-act="mpagain">Play again</button>':'<button class="btn" data-act="mpend">End game now</button>')+'<button class="btn alt" data-act="home">Close room</button>':'<button class="btn alt" data-act="home">Leave room</button>';
  if(m.role==='guest'&&over)sub+='<p class="note">Waiting for the teacher to start another game.</p>';
  return '<h1 class="h1">'+title+'</h1>'+sub+boardRows(rows,m.n,me)+'<div class="actions">'+btns+'</div>';
}

/* ---------- EVENTS ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='home')go('home');
  else if(a==='go')go(t.dataset.mode);
  else if(a==='vault')go('vault');
  else if(a==='play')startRound(t.dataset.mode,t.dataset.set);
  else if(a==='deck')startDeck(t.dataset.deck);
  else if(a==='flip'){F.flipped=true;renderCard();}
  else if(a==='got'||a==='again'){cardDone(a==='got');}
  else if(a==='opt')answerChoice(+t.dataset.i);
  else if(a==='next'){R.i++;if(R.i>=R.qs.length){if(R.multi)mpDone();else results();}else{renderQ();window.scrollTo(0,0);}}
  else if(a==='again2')startRound(R?R.mode:'time',R?R.set:'');
  else if(a==='say')say(t.dataset.say);
  else if(a==='host')hostRoom();
  else if(a==='mpstart'&&MP)startGame(MP);
  else if(a==='mpend'&&MP)finishGame(MP);
  else if(a==='mpagain'&&MP){MP.phase='lobby';MP.players.host=MP.teacherPlays?hostPlayer():undefined;if(!MP.teacherPlays)delete MP.players.host;Object.keys(MP.players).forEach(function(id){if(MP.players[id].l)delete MP.players[id];});lobbyBroadcast(MP);}
  else if(a==='login')go('login');
  else if(a==='code')go('code');
  else if(a==='loginAs')login(t.dataset.name);
  else if(a==='import'){
    var p=readCode(($('#ic')||{}).value);
    if(!p){toast('That code does not look right. Copy the whole code and try again.');return;}
    var old=ALL.profiles[p.name];
    if(old){old.xp=Math.max(old.xp,p.xp);Object.keys(p.cards).forEach(function(k){old.cards[k]=Math.max(old.cards[k]||0,p.cards[k]);});Object.keys(p.best).forEach(function(k){old.best[k]=Math.max(old.best[k]||0,p.best[k]);});}
    else ALL.profiles[p.name]=p;
    toast('Welcome back, '+p.name+'! Points loaded.');login(p.name);
  }
  else if(a==='copycode'){
    var f=$('#sc');f.select();
    var done=function(){toast('Code copied.');};
    try{navigator.clipboard.writeText(f.value).then(done,function(){document.execCommand('copy');done();});}catch(e){try{document.execCommand('copy');done();}catch(e2){toast('Select the code and copy it.');}}
  }
});
app.addEventListener('submit',function(e){
  if(e.target.id==='tf'){e.preventDefault();answerType();}
  else if(e.target.id==='jf'){e.preventDefault();joinRoom($('#jc').value);}
  else if(e.target.id==='nf'){
    e.preventDefault();
    var n=$('#nn').value.replace(/[<>&"]/g,'').trim().slice(0,20);
    if(n.length<2){toast('Choose a nickname with at least 2 letters.');return;}
    var ex=Object.keys(ALL.profiles).filter(function(k){return k.toLowerCase()===n.toLowerCase();})[0];
    if(ex){toast('That nickname already exists. Pick it from the list above.');return;}
    ALL.profiles[n]=blank(n);login(n);
  }
});
function cardDone(got){
  var c=F.q[F.i];
  if(got){S.cards[c.id]=Math.min(3,(S.cards[c.id]||0)+1);F.got++;addXP(3);}
  else{S.cards[c.id]=0;F.again++;if(!F.re[c.id]){F.re[c.id]=1;F.q.push(c);}}
  save();F.i++;F.flipped=false;renderCard();
}
app.addEventListener('change',function(e){
  if(!MP||MP.role!=='host')return;
  if(e.target.id==='mpmode'){var v=e.target.value.split('|');MP.mode=v[0];MP.set=v[1];}
  else if(e.target.id==='mptp'){MP.teacherPlays=e.target.checked;if(MP.teacherPlays)MP.players.host=MP.players.host||hostPlayer();else delete MP.players.host;lobbyBroadcast(MP);}
});
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'');
  if(F&&F.active){
    if(e.key===' '&&tag!=='BUTTON'&&!F.flipped){e.preventDefault();F.flipped=true;renderCard();}
    else if(F.flipped&&e.key==='ArrowRight'){cardDone(true);}
    else if(F.flipped&&e.key==='ArrowLeft'){cardDone(false);}
    return;
  }
  if(R&&R.active&&!R.answered&&tag!=='INPUT'){
    var q=R.qs[R.i];
    if(q.kind!=='type'){var n=parseInt(e.key,10);if(n>=1&&n<=q.options.length){answerChoice(n-1);}}
  }
});

/* ---------- START ---------- */
(function(){
  go('login');
})();
})();
</script>
